<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bairro Seguro | Ocorrências</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark small" aria-hidden="true"></div>
      <h1>Bairro Seguro</h1>
    </div>
    <div class="topbar-right">
      <span id="boasVindas">Olá, morador</span>
      <button id="sairBtn" type="button">Sair</button>
    </div>
  </header>

  <main class="layout">
    <section class="search-wrap">
      <input id="buscaBairro" type="text" placeholder="Buscar bairro, endereço ou tipo de ocorrência...">
    </section>

    <section class="map-card" aria-label="Mapa de ocorrências">
      <div id="map"></div>
      <div class="map-hint">Busque um CEP, clique no mapa e use o emoji para registrar a ocorrência.</div>
    </section>

    <section class="occurrences">
      <div class="occurrences-header">
        <div class="occurrences-title">Ocorrências</div>
      </div>
      <ul id="listaOcorrencias"></ul>
    </section>

    <section class="actions">
      <div class="cep-row">
        <input id="cepInput" type="text" inputmode="numeric" placeholder="Digite o CEP no formato XXXXX-XXX" maxlength="9">
        <button type="button" id="buscarCepBtn">Buscar CEP</button>
      </div>

      <div id="enderecoEncontrado" class="endereco-box">
        <p id="enderecoTexto"></p>
      </div>

      <div id="formOcorrencia" class="form-occurrence">
        <select id="emojiSelect">
          <option value="">Selecione o emoji da ocorrência</option>
          <option value="🚨">🚨 Assalto/roubo</option>
          <option value="💡">💡 Iluminação apagada</option>
          <option value="🔊">🔊 Som alto/barulho</option>
          <option value="🚫">🚫 Vandalismo/dano</option>
          <option value="⚠️">⚠️ Assédio</option>
          <option value="📍">📍 Outro problema</option>
        </select>
        <textarea id="detalheInput" rows="3" placeholder="Detalhe a ocorrência (opcional)"></textarea>
        <div class="form-actions">
          <button type="button" id="relatarBtn">Relatar no mapa</button>
          <button type="button" id="limparBtn" class="btn-secondary">Limpar seleção</button>
        </div>
      </div>

      <p id="feedbackBusca" class="feedback" aria-live="polite"></p>
      <p id="feedbackRelato" class="feedback" aria-live="polite"></p>
    </section>
  </main>

  <!-- Modal de edição -->
  <div id="editModal" class="edit-modal-overlay" role="dialog" aria-modal="true" aria-label="Editar ocorrência">
    <div class="edit-modal-box">
      <div class="edit-modal-header">
        <h2>Editar ocorrência</h2>
        <button id="editModalClose" class="edit-modal-close" aria-label="Fechar">✕</button>
      </div>
      <form id="editForm" class="edit-form">
        <input type="hidden" id="editId">

        <label class="edit-label" for="editEmoji">Tipo de ocorrência</label>
        <select id="editEmoji" class="edit-select">
          <option value="">Selecione</option>
          <option value="🚨">🚨 Assalto/roubo</option>
          <option value="💡">💡 Iluminação apagada</option>
          <option value="🔊">🔊 Som alto/barulho</option>
          <option value="🚫">🚫 Vandalismo/dano</option>
          <option value="⚠️">⚠️ Assédio</option>
          <option value="📍">📍 Outro problema</option>
        </select>

        <label class="edit-label" for="editEndereco">Endereço</label>
        <input id="editEndereco" class="edit-input" type="text" placeholder="Endereço da ocorrência">

        <label class="edit-label" for="editDetalhe">Descrição</label>
        <textarea id="editDetalhe" class="edit-textarea" rows="4" placeholder="Detalhe a ocorrência..."></textarea>

        <div class="edit-actions">
          <button type="submit" class="edit-btn-save">Salvar alterações</button>
          <button type="button" id="editModalClose2" class="edit-btn-cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/utils.js"></script>
  <script src="script.js"></script>
  <script>
    // Segundo botão cancelar do modal
    document.getElementById("editModalClose2").addEventListener("click", function () {
      document.getElementById("editModal").classList.remove("visible");
    });
  </script>
</body>
</html>
